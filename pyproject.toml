[project]
name = "rag-evals"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chroma>=0.2.0",
    "deepeval>=4.2.3",
    "google-cloud-aiplatform>=2.1.3",
    "google-genai>=2.24.0",
    "instructor[google-genai]>=1.17.0",
    "lancedb>=0.39.0",
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-community<0.4",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface",
    "langchain-text-splitters>=1.1.2",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "ragas>=0.4.3",
    "rapidfuzz>=3.14.6",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
rag-evals = "rag_evals:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
